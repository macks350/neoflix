<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Неофликс</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16111f;--surface:#231b33;--line:#3a2e52;--text:#f4eefc;--muted:#a99cc4;--accent:#ff5a3c;--ok:#5ad19a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:Unbounded,sans-serif;font-weight:800;font-size:20px;color:var(--accent);margin-right:auto}
.badge{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted)}
.wallet{font-weight:700;background:var(--surface);border-radius:99px;padding:6px 12px}
nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);font:600 15px Manrope;padding:8px 14px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--surface);color:var(--text)}
main{padding:0 16px 32px;max-width:960px;margin:auto}
h2{font-family:Unbounded,sans-serif;font-size:18px;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.film{border:0;padding:0;background:none;text-align:left;color:inherit;cursor:pointer}
.poster{aspect-ratio:2/3;border-radius:var(--r);display:flex;align-items:flex-end;padding:12px;font:800 16px Unbounded;line-height:1.2}
.film small{display:block;color:var(--muted);margin-top:6px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.plan.cur{border-color:var(--accent)}
.plan b{font:800 17px Unbounded}
.plan .price{font-size:22px;font-weight:700}
.plan p{margin:0;color:var(--muted);font-size:14px}
.btn{margin-top:auto;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;font:700 15px Manrope;cursor:pointer}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.box{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:12px}
.box input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px;font:inherit;width:120px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dialog{border:0;border-radius:var(--r);padding:0;background:#000;width:min(94vw,860px)}
dialog::backdrop{background:#000c}
dialog video{width:100%;display:block}
dialog .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface)}
dialog .bar button{background:none;border:0;color:var(--text);font-size:22px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="logo">Неофликс</div>
  <span class="badge">Демо · виртуальные деньги</span>
  <span class="wallet" id="wallet">…</span>
</header>
<nav id="nav">
  <button data-t="films" class="on">Фильмы</button>
  <button data-t="plans">Тарифы</button>
  <button data-t="admin" id="adminTab" hidden>Админ</button>
  <button data-t="adminLogin" id="loginTab">Вход для админов</button>
</nav>
<main id="view"></main>
<footer>Неофликс — учебный проект. Баланс общий с демо-банком.</footer>

<dialog id="player">
  <div class="bar"><span id="ptitle"></span><button id="pclose" aria-label="Закрыть">×</button></div>
  <video id="video" controls playsinline></video>
</dialog>
<div id="toast"></div>

<script>
/* ====== НАСТРОЙКИ ====== */
const ADMIN_CODE = 'admin123';          // смените код
const WEEK_MS = 7 * 24 * 3600 * 1000;

// Добавляйте сюда только видео, на которые у вас есть права.
const FILMS = [
  {t:'Big Buck Bunny', y:2008, src:'https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4'},
  {t:'Sintel (трейлер)', y:2010, src:'https://download.blender.org/durian/trailer/sintel_trailer-480p.mp4'},
  {t:'Tears of Steel', y:2012, src:'https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov'},
];

const PLANS = [
  {id:'free',     name:'Обч',        films:5,    price:0},
  {id:'pro',      name:'Про',        films:50,   price:1000},
  {id:'proplus',  name:'Про+',       films:500,  price:1500},
  {id:'max',      name:'Про Макс',   films:650,  price:5000},
  {id:'maxplus',  name:'Про Макс+',  films:750,  price:10000},
  {id:'ultra',    name:'Ультра',     films:1000, price:65000},
  {id:'ultraplus',name:'Ультра+',    films:4500, price:10000},
];
const ADMIN_PLAN = {id:'admin', name:'Админ', films:Infinity, price:0};

/* ====== МОСТ С БАНКОМ (общий кошелёк) ====== */
const WKEY = 'demoWallet';
const getW = () => { try{const w=JSON.parse(localStorage.getItem(WKEY)); if(w&&typeof w.balance==='number') return w;}catch(e){} return {balance:125430, ops:[]}; };
const setW = w => localStorage.setItem(WKEY, JSON.stringify(w));
function pay(amount, title){
  const w = getW();
  if (w.balance < amount) return false;
  w.balance -= amount;
  w.ops = [{title, amount:-amount, ts:Date.now()}, ...(w.ops||[])].slice(0,50);
  setW(w); return true;
}

/* ====== СОСТОЯНИЕ ====== */
const SKEY = 'neoflixState';
let S = (()=>{ try{const s=JSON.parse(localStorage.getItem(SKEY)); if(s) return s;}catch(e){}
  return {plan:'free', next:Date.now()+WEEK_MS, watched:[], admin:false, week:WEEK_MS}; })();
const save = () => localStorage.setItem(SKEY, JSON.stringify(S));
const planOf = id => id==='admin' ? ADMIN_PLAN : PLANS.find(p=>p.id===id);
const fmt = n => Number(n).toLocaleString('ru-RU');
const $ = s => document.querySelector(s);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2600); }

/* Еженедельное списание */
function billing(){
  let changed=false;
  while (Date.now() >= S.next){
    const p = planOf(S.plan);
    if (p.price>0 && !S.admin){
      if (!pay(p.price, 'Неофликс: тариф «'+p.name+'»')){
        S.plan='free'; toast('Не хватило средств — включён тариф Обч');
      }
    }
    S.watched=[]; S.next += S.week; changed=true;
  }
  if(changed) save();
}

/* ====== ЭКРАНЫ ====== */
let tab='films';
function render(){
  billing();
  $('#wallet').textContent = fmt(getW().balance)+' ₽';
  $('#adminTab').hidden = !S.admin;
  $('#loginTab').hidden = S.admin;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  const v=$('#view');
  if(tab==='films') v.innerHTML = filmsView();
  else if(tab==='plans') v.innerHTML = plansView();
  else if(tab==='admin' && S.admin) v.innerHTML = adminView();
  else if(tab==='adminLogin') v.innerHTML = loginView();
}

function filmsView(){
  const p = planOf(S.plan), left = p.films===Infinity ? '∞' : Math.max(0,p.films-S.watched.length);
  const days = Math.max(0, Math.ceil((S.next-Date.now())/(S.week/7)));
  return `<h2>Фильмы</h2>
  <div class="box">Тариф «${p.name}» · осталось фильмов на неделю: <b>${left}</b>${p.price?` · следующее списание через ${days} дн.`:''}</div>
  <div class="grid">${FILMS.map((f,i)=>`
    <button class="film" data-i="${i}">
      <div class="poster" style="background:linear-gradient(160deg,hsl(${(i*57+10)%360} 70% 45%),hsl(${(i*57+60)%360} 60% 18%))">${f.t}</div>
      <small>${f.y}${S.watched.includes(i)?' · открыт':''}</small>
    </button>`).join('')}</div>`;
}

function plansView(){
  return `<h2>Тарифы</h2><div class="plans">${PLANS.map(p=>`
    <div class="plan ${p.id===S.plan?'cur':''}">
      <b>${p.name}</b>
      <div class="price">${p.price?fmt(p.price)+' ₽ / неделя':'Бесплатно'}</div>
      <p>${fmt(p.films)} фильмов в неделю</p>
      <button class="btn" data-plan="${p.id}" ${p.id===S.plan?'disabled':''}>${p.id===S.plan?'Ваш тариф':'Подключить'}</button>
    </div>`).join('')}</div>`;
}

function loginView(){
  return `<h2>Вход для админов</h2><div class="box row">
  <input id="code" type="password" placeholder="Код" autocomplete="off">
  <button class="btn" id="login" style="margin:0;padding:10px 16px">Войти</button></div>`;
}

function adminView(){
  return `<h2>Админ</h2>
  <div class="box row"><input id="sum" type="number" value="10000">
    <button class="btn" id="topup" style="margin:0;padding:10px 16px">Пополнить общий кошелёк</button></div>
  <div class="box"><label class="row"><input type="checkbox" id="fast" ${S.week<WEEK_MS?'checked':''} style="width:auto">
    Тест: «неделя» = 1 минута</label></div>
  <div class="box row"><button class="btn" id="own" style="margin:0;padding:10px 16px">Включить тариф Админ</button>
    <button class="btn" id="logout" style="margin:0;padding:10px 16px;background:var(--line)">Выйти</button></div>`;
}

/* ====== СОБЫТИЯ ====== */
document.addEventListener('click', e=>{
  const nb=e.target.closest('#nav button'); if(nb){tab=nb.dataset.t; render(); return;}
  const fb=e.target.closest('.film'); if(fb){ openFilm(+fb.dataset.i); return; }
  const pb=e.target.closest('[data-plan]'); if(pb){ subscribe(pb.dataset.plan); return; }
  if(e.target.id==='login'){ if($('#code').value===ADMIN_CODE){S.admin=true;save();tab='admin';render();toast('Вы вошли как админ');} else toast('Неверный код'); }
  if(e.target.id==='logout'){ S.admin=false; if(S.plan==='admin') S.plan='free'; save(); tab='films'; render(); }
  if(e.target.id==='topup'){ const n=+$('#sum').value; if(n>0){const w=getW(); w.balance+=n; w.ops=[{title:'Пополнение (админ)',amount:n,ts:Date.now()},...(w.ops||[])]; setW(w); render(); toast('Кошелёк пополнен');} }
  if(e.target.id==='own'){ S.plan='admin'; save(); tab='films'; render(); }
  if(e.target.id==='fast'){ S.week = e.target.checked ? 60000 : WEEK_MS; S.next = Date.now()+S.week; save(); }
});

function subscribe(id){
  const p=planOf(id);
  if(p.price && !pay(p.price,'Неофликс: тариф «'+p.name+'»')){ toast('Недостаточно средств в кошельке'); return; }
  S.plan=id; S.next=Date.now()+S.week; S.watched=[]; save(); render();
  toast('Тариф «'+p.name+'» подключён');
}

function openFilm(i){
  const p=planOf(S.plan);
  if(!S.watched.includes(i)){
    if(S.watched.length>=p.films){ toast('Лимит недели исчерпан — смените тариф'); return; }
    S.watched.push(i); save();
  }
  $('#ptitle').textContent=FILMS[i].t;
  const v=$('#video'); v.src=FILMS[i].src; $('#player').showModal(); v.play().catch(()=>{});
  render();
}
$('#pclose').onclick = ()=>$('#player').close();
$('#player').addEventListener('close', ()=>{ const v=$('#video'); v.pause(); v.removeAttribute('src'); v.load(); });

/* Живая синхронизация с банком в другой вкладке */
window.addEventListener('storage', e=>{ if(e.key===WKEY||e.key===SKEY){ if(e.key===SKEY) S=JSON.parse(e.newValue); render(); }});
setInterval(render, 30000);
render();
</script>
</body>
</html>
